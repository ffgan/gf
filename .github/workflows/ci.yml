name: CI

on:
  push:
    branches: [master, dev]
    tags: ["v*"]
  pull_request:

# Package jobs stay read-only. The publish job opts into contents: write.
permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: .go-version
      - name: Test
        run: go test ./...

  package:
    name: package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: .go-version
      - uses: nttld/setup-ndk@v1.6.0
        id: ndk
        with:
          ndk-version: r27d
          add-to-path: false
      - name: Version
        shell: bash
        run: |
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            ver="${GITHUB_REF_NAME#v}"
          else
            ver="0.0.0-ci"
          fi
          echo "VERSION=$ver" >> "$GITHUB_ENV"
      - name: Build archives
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
        run: bash scripts/build-release.sh
      - name: Upload archives
        if: github.ref_type == 'tag'
        uses: actions/upload-artifact@v7.0.2
        with:
          name: dist-host
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  package-ios:
    name: package ios/arm64
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: .go-version
      - name: Version
        run: |
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            ver="${GITHUB_REF_NAME#v}"
          else
            ver="0.0.0-ci"
          fi
          echo "VERSION=$ver" >> "$GITHUB_ENV"
      - name: Build ios/arm64
        run: bash scripts/build-release.sh ios/arm64
      - name: Upload archive
        if: github.ref_type == 'tag'
        uses: actions/upload-artifact@v7.0.2
        with:
          name: dist-ios
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  publish:
    name: publish release
    needs: [test, package, package-ios]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: .go-version
      - uses: actions/download-artifact@v8.0.2
        with:
          pattern: dist-*
          merge-multiple: true
          path: downloaded
      - name: Version
        run: |
          echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          echo "GO_VERSION=$(tr -d '[:space:]' < .go-version)" >> "$GITHUB_ENV"
      - name: Collect archives
        run: |
          mkdir -p dist
          find downloaded -type f \( -name '*.tar.gz' -o -name '*.zip' \) -exec mv {} dist/ \;
          find dist -type f | wc -l
      - name: Check the archive set
        run: bash scripts/build-release.sh --expect-dist
      - name: Checksums
        run: |
          cd dist
          rm -f gf_*_checksums.txt
          LC_ALL=C sha256sum -- gf_* | tee "gf_${VERSION}_checksums.txt"
      - name: Publish GitHub release
        uses: softprops/action-gh-release@v3.0.3
        with:
          fail_on_unmatched_files: true
          generate_release_notes: true
          files: dist/*
          body: |
            用 Go ${{ env.GO_VERSION }} 构建。这是目前仍在维护的最老 Go 版本，二进制保持它的系统要求（macOS 12，Linux ppc64 的 ELFv1）。

            覆盖该版本 `go tool dist list` 的全部目标。32 位 ARM 提供 ARMv5、ARMv6、ARMv7。MIPS 同时提供 hardfloat 和 softfloat。

            `android/386`、`android/amd64`、`android/armv7` 用 Android NDK r27d（API 21）做外部链接。`ios/arm64` 用 Xcode 的 iOS SDK，最低系统版本是 iOS 12。其余目标都是 `CGO_ENABLED=0`。

            Go 1.26 已经去掉 `windows/arm`，也不再列出 `freebsd/riscv64`，所以这两个移植不在这个 release 里。

            每个压缩包里是可执行文件、LICENSE 和 README。SHA-256 在 `gf_*_checksums.txt`。
